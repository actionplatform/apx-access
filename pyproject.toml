[project]
name = "apx-access"
version = "0.1.1"
description = "Access for Action Platform: an organization's members, teams and roles mapped onto GitHub, Jenkins, Sentry and Dokploy — read live state, diff, apply, offboard."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<4"
authors = [{ name = "Action Platform", email = "cloud@actionplatform.io" }]
dependencies = ["action-platform>=0.32"]

[project.urls]
Repository = "https://github.com/actionplatform/apx-access"

[project.entry-points."action_platform.plugins"]
access = "apx_access:AccessPlugin"

[tool.poetry]
packages = [{ include = "apx_access" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
action-platform = { version = ">=0.32", extras = ["mcp"] }

[tool.poetry.group.code-quality.dependencies]
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
